<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Space Shooter - Life 3 Mode</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            position: fixed;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    joystick.baseX = 80;
    joystick.baseY = canvas.height - 100;
    joystick.stickX = joystick.baseX;
    joystick.stickY = joystick.baseY;
}
window.addEventListener('resize', resizeCanvas);

// --- ジョイスティックの設定 ---
const joystick = {
    baseX: 80, baseY: 0, baseRadius: 50,
    stickX: 80, stickY: 0, stickRadius: 25,
    active: false, touchId: null, vx: 0, vy: 0
};

// --- ゲーム状態・システム管理 ---
let gameState = 'TITLE'; 
let score = 0;
let currentStage = 1;
const maxStage = 3;
let stageDefeatedCount = 0; 
const stageTargetKills = 10; 

let lastShotTime = 0;
const shotInterval = 150; 
const playerSpeed = 8;  // ★快適な移動スピードをキープ！

// --- オブジェクト配列 ---
const player = { 
    x: 0, y: 0, size: 20, 
    powerLevel: 1, 
    lives: 3,           // ★ライフを3に設定
    invincibleTime: 0   // 被弾後の無敵時間タイマー
}; 

let bullets = [];
let enemies = [];
let items = [];
let particles = []; 

let lastEnemyTime = 0;
const enemyInterval = 600; // 元の緊張感のある出現頻度に戻す

resizeCanvas();

// --- タッチイベント ---
window.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (gameState === 'TITLE' || gameState === 'GAMEOVER' || gameState === 'ALL_CLEAR') {
        resetGame();
        gameState = 'PLAYING';
        return;
    }
    if (gameState === 'STAGE_CLEAR') {
        startNextStage();
        gameState = 'PLAYING';
        return;
    }
    for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        const dist = Math.hypot(touch.clientX - joystick.baseX, touch.clientY - joystick.baseY);
        if (dist < joystick.baseRadius + 30 && !joystick.active) {
            joystick.active = true;
            joystick.touchId = touch.identifier;
            updateJoystick(touch.clientX, touch.clientY);
        }
    }
}, { passive: false });

window.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (gameState !== 'PLAYING') return;
    for (let i = 0; i < e.touches.length; i++) {
        const touch = e.touches[i];
        if (touch.identifier === joystick.touchId) {
            updateJoystick(touch.clientX, touch.clientY);
        }
    }
}, { passive: false });

window.addEventListener('touchend', (e) => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === joystick.touchId) {
            joystick.active = false;
            joystick.touchId = null;
            joystick.stickX = joystick.baseX;
            joystick.stickY = joystick.baseY;
            joystick.vx = 0; joystick.vy = 0;
        }
    }
}, { passive: false });

function updateJoystick(touchX, touchY) {
    const dx = touchX - joystick.baseX;
    const dy = touchY - joystick.baseY;
    const dist = Math.hypot(dx, dy);
    if (dist <= joystick.baseRadius) {
        joystick.stickX = touchX; joystick.stickY = touchY;
    } else {
        joystick.stickX = joystick.baseX + (dx / dist) * joystick.baseRadius;
        joystick.stickY = joystick.baseY + (dy / dist) * joystick.baseRadius;
    }
    joystick.vx = (joystick.stickX - joystick.baseX) / joystick.baseRadius;
    joystick.vy = (joystick.stickY - joystick.baseY) / joystick.baseRadius;
}

function createExplosion(x, y, color) {
    for (let i = 0; i < 8; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            size: Math.random() * 3 + 2,
            life: 20,
            color: color
        });
    }
}

// プレイヤーがダメージを受けた時の処理
function playerHit() {
    if (player.invincibleTime > 0) return; // 無敵中なら無視

    player.lives--;
    createExplosion(player.x, player.y, '#ff4500');

    if (player.lives <= 0) {
        gameState = 'GAMEOVER';
    } else {
        // 1.5秒間（約90フレーム）の無敵時間を付与
        player.invincibleTime = 90;
        // パワーダウンペナルティ（最低1）
        if (player.powerLevel > 1) player.powerLevel--;
    }
}

function startNextStage() {
    currentStage++;
    stageDefeatedCount = 0;
    bullets = [];
    enemies = [];
    items = [];
    player.x = canvas.width / 2;
    player.y = canvas.height - 150;
    player.invincibleTime = 60; // ステージ開始直後も少し無敵に
}

function resetGame() {
    score = 0;
    currentStage = 1;
    stageDefeatedCount = 0;
    player.powerLevel = 1;
    player.lives = 3; // ライフリセット
    player.invincibleTime = 0;
    bullets = [];
    enemies = [];
    items = [];
    particles = [];
    player.x = canvas.width / 2;
    player.y = canvas.height - 150;
    lastShotTime = 0;
    lastEnemyTime = 0;
    joystick.active = false;
    joystick.vx = 0; joystick.vy = 0;
    joystick.stickX = joystick.baseX;
    joystick.stickY = joystick.baseY;
}

function gameLoop(timestamp) {
    update(timestamp);
    draw();
    requestAnimationFrame(gameLoop);
}

function update(timestamp) {
    if (gameState !== 'PLAYING') return;

    // 無敵タイマーのカウントダウン
    if (player.invincibleTime > 0) {
        player.invincibleTime--;
    }

    player.x += joystick.vx * playerSpeed;
    player.y += joystick.vy * playerSpeed;
    player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x));
    player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y));

    // ショット：アイテム強化制（1発 ➔ 2方向 ➔ 3方向）に戻す
    if (timestamp - lastShotTime > shotInterval) {
        if (player.powerLevel === 1) {
            bullets.push({ x: player.x, y: player.y - player.size, vx: 0, vy: -12, size: 4 });
        } else if (player.powerLevel === 2) {
            bullets.push({ x: player.x - 10, y: player.y - player.size, vx: -1.5, vy: -12, size: 4 });
            bullets.push({ x: player.x + 10, y: player.y - player.size, vx: 1.5, vy: -12, size: 4 });
        } else {
            bullets.push({ x: player.x, y: player.y - player.size, vx: 0, vy: -12, size: 4 });
            bullets.push({ x: player.x - 15, y: player.y - player.size, vx: -3, vy: -11, size: 4 });
            bullets.push({ x: player.x + 15, y: player.y - player.size, vx: 3, vy: -11, size: 4 });
        }
        lastShotTime = timestamp;
    }

    bullets.forEach((b, index) => {
        b.x += b.vx;
        b.y += b.vy;
        if (b.y < 0 || b.x < 0 || b.x > canvas.width) bullets.splice(index, 1);
    });

    // 敵のスピード：元の手応えのある速度に戻す
    const speedMultiplier = 1 + (currentStage - 1) * 0.4; 
    if (timestamp - lastEnemyTime > (enemyInterval / speedMultiplier)) {
        if (enemies.length + stageDefeatedCount < stageTargetKills) {
            enemies.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: -20,
                speed: (Math.random() * 2 + 3) * speedMultiplier, 
                size: 15
            });
            lastEnemyTime = timestamp;
        }
    }

    enemies.forEach((enemy, eIndex) => {
        enemy.y += enemy.speed;

        // 画面最下部に到達したらライフが減る（敵は消滅）
        if (enemy.y > canvas.height) {
            enemies.splice(eIndex, 1);
            playerHit();
            return;
        }

        // プレイヤーとの衝突判定
        if (Math.hypot(enemy.x - player.x, enemy.y - player.y) < enemy.size + player.size) {
            if (player.invincibleTime === 0) {
                enemies.splice(eIndex, 1); // 当たった敵は消える
                playerHit();
                return;
            }
        }

        bullets.forEach((bullet, bIndex) => {
            if (Math.hypot(enemy.x - bullet.x, enemy.y - bullet.y) < enemy.size + bullet.size) {
                createExplosion(enemy.x, enemy.y, '#f87171');
                enemies.splice(eIndex, 1);
                bullets.splice(bIndex, 1);
                score += 10;
                stageDefeatedCount++;

                // アイテムドロップ率を元の25%に戻す
                if (Math.random() < 0.25) {
                    items.push({ x: enemy.x, y: enemy.y, speed: 2, size: 12 });
                }

                if (stageDefeatedCount >= stageTargetKills) {
                    if (currentStage === maxStage) {
                        gameState = 'ALL_CLEAR';
                    } else {
                        gameState = 'STAGE_CLEAR';
                    }
                }
            }
        });
    });

    items.forEach((item, index) => {
        item.y += item.speed;
        if (item.y > canvas.height) items.splice(index, 1);

        if (Math.hypot(item.x - player.x, item.y - player.y) < item.size + player.size) {
            items.splice(index, 1);
            score += 50;
            if (player.powerLevel < 3) player.powerLevel++;
            createExplosion(player.x, player.y, '#facc15');
        }
    });

    particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(index, 1);
    });
}

function draw() {
    ctx.fillStyle = '#0f172a'; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'TITLE') {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('SPACE SHOOTER', canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = '18px sans-serif';
        ctx.fillStyle = '#38bdf8';
        ctx.fillText('画面をタップしてスタート', canvas.width / 2, canvas.height / 2 + 30);
        return;
    }

    if (gameState === 'GAMEOVER') {
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = '18px sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
        ctx.fillStyle = '#38bdf8';
        ctx.fillText('タップしてリトライ', canvas.width / 2, canvas.height / 2 + 60);
        return;
    }

    if (gameState === 'STAGE_CLEAR') {
        ctx.fillStyle = '#4ade80';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`STAGE ${currentStage} CLEAR!`, canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = '18px sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText('タップして次のステージへ', canvas.width / 2, canvas.height / 2 + 30);
        return;
    }

    if (gameState === 'ALL_CLEAR') {
        ctx.fillStyle = '#facc15';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('VICTORY!', canvas.width / 2, canvas.height / 2 - 40);
        ctx.fillStyle = '#fff';
        ctx.font = '20px sans-serif';
        ctx.fillText('全ステージクリア達成！', canvas.width / 2, canvas.height / 2 + 5);
        ctx.fillText(`Total Score: ${score}`, canvas.width / 2, canvas.height / 2 + 40);
        ctx.fillStyle = '#38bdf8';
        ctx.fillText('タップしてタイトルへ', canvas.width / 2, canvas.height / 2 + 90);
        return;
    }

    bullets.forEach(b => {
        ctx.fillStyle = '#facc15';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2); ctx.fill();
    });

    // プレイヤー（機体）の描画（無敵時間はチカチカ点滅させる）
    if (player.invincibleTime === 0 || Math.floor(player.invincibleTime / 4) % 2 === 0) {
        ctx.fillStyle = player.powerLevel == 1 ? '#38bdf8' : (player.powerLevel == 2 ? '#a855f7' : '#f43f5e'); 
        ctx.beginPath();
        ctx.moveTo(player.x, player.y - player.size);
        ctx.lineTo(player.x - player.size, player.y + player.size);
        ctx.lineTo(player.x + player.size, player.y + player.size);
        ctx.closePath(); ctx.fill();
    }

    enemies.forEach(e => {
        ctx.fillStyle = '#f87171';
        ctx.beginPath(); ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2); ctx.fill();
    });

    items.forEach(item => {
        ctx.fillStyle = '#facc15';
        ctx.fillRect(item.x - item.size/2, item.y - item.size/2, item.size, item.size);
        ctx.fillStyle = '#000';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('P', item.x, item.y + 4);
    });

    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    });

    // UI表示（ライフをハートマークで表現）
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'left';
    
    let heartStr = '';
    for(let i=0; i<player.lives; i++) heartStr += '❤️';
    ctx.fillText(`LIFE: ${heartStr}`, 20, 40);
    ctx.fillText(`STAGE: ${currentStage}`, 20, 65);
    ctx.fillText(`SCORE: ${score}`, 20, 90);
    
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(20, 105, 100, 6);
    ctx.fillStyle = '#4ade80';
    ctx.fillRect(20, 105, (stageDefeatedCount / stageTargetKills) * 100, 6);

    ctx.beginPath();
    ctx.arc(joystick.baseX, joystick.baseY, joystick.baseRadius, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; ctx.stroke();

    ctx.beginPath();
    ctx.arc(joystick.stickX, joystick.stickY, joystick.stickRadius, 0, Math.PI * 2);
    ctx.fillStyle = joystick.active ? 'rgba(56, 189, 248, 0.6)' : 'rgba(255, 255, 255, 0.4)';
    ctx.fill();
}

requestAnimationFrame(gameLoop);
</script>

</body>
</html>
