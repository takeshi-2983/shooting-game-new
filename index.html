<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iPhone Web Shooting</title>
    <style>
        /* iPhoneの全画面表示・誤動作防止用のスタイル */
        * {
            box-sizing: border-box;
            touch-action: none; /* ダブルタップズームやスクロールを無効化 */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            position: fixed;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 画面解像度に合わせてキャンバスサイズを設定
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ゲームの状態管理
let gameState = 'TITLE'; // TITLE, PLAYING, GAMEOVER
let score = 0;
let lastShotTime = 0;
const shotInterval = 150; // 弾の発射間隔（ミリ秒）

// プレイヤーオブジェクト
const player = {
    x: canvas.width / 2,
    y: canvas.height - 100,
    size: 20,
    isTouching: false
};

// 配列管理
let bullets = [];
let enemies = [];

// 敵の生成タイミング
let lastEnemyTime = 0;
const enemyInterval = 600; // 敵の出現間隔（ミリ秒）

// --- タッチイベントの処理 (iPhone最適化) ---
function getTouchPos(e) {
    if (!e.touches || e.touches.length === 0) return null;
    const touch = e.touches[0];
    return { x: touch.clientX, y: touch.clientY };
}

window.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (gameState === 'TITLE' || gameState === 'GAMEOVER') {
        resetGame();
        gameState = 'PLAYING';
        return;
    }
    
    const pos = getTouchPos(e);
    if (pos) {
        player.isTouching = true;
        // タッチした位置に自機を瞬間移動させず、スムーズに追従させるための初期位置調整
        player.x = pos.x;
        player.y = pos.y - 30; // 指で自機が隠れないように少し上に配置
    }
}, { passive: false });

window.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (gameState !== 'PLAYING') return;
    
    const pos = getTouchPos(e);
    if (pos) {
        // 画面外にはみ出さないように制御
        player.x = Math.max(player.size, Math.min(canvas.width - player.size, pos.x));
        player.y = Math.max(player.size, Math.min(canvas.height - player.size, pos.y - 30));
    }
}, { passive: false });

window.addEventListener('touchend', (e) => {
    player.isTouching = false;
});

// ゲームのリセット
function resetGame() {
    score = 0;
    bullets = [];
    enemies = [];
    player.x = canvas.width / 2;
    player.y = canvas.height - 100;
    lastShotTime = 0;
    lastEnemyTime = 0;
}

// --- メインゲームループ ---
function gameLoop(timestamp) {
    update(timestamp);
    draw();
    requestAnimationFrame(gameLoop);
}

// データ更新
function update(timestamp) {
    if (gameState !== 'PLAYING') return;

    // 1. 自動弾発射（画面に触れている時）
    if (player.isTouching && timestamp - lastShotTime > shotInterval) {
        bullets.push({
            x: player.x,
            y: player.y - player.size,
            speed: 10,
            size: 4
        });
        lastShotTime = timestamp;
    }

    // 2. 弾の移動と画面外判定
    bullets.forEach((b, index) => {
        b.y -= b.speed;
        if (b.y < 0) bullets.splice(index, 1);
    });

    // 3. 敵の自動生成
    if (timestamp - lastEnemyTime > enemyInterval) {
        enemies.push({
            x: Math.random() * (canvas.width - 40) + 20,
            y: -20,
            speed: Math.random() * 2 + 3,
            size: 15
        });
        lastEnemyTime = timestamp;
    }

    // 4. 敵の移動と判定
    enemies.forEach((enemy, eIndex) => {
        enemy.y += enemy.speed;

        // 画面最下部に到達したらゲームオーバー
        if (enemy.y > canvas.height) {
            gameState = 'GAMEOVER';
        }

        // プレイヤーとの衝突判定
        const distToPlayer = Math.hypot(enemy.x - player.x, enemy.y - player.y);
        if (distToPlayer < enemy.size + player.size) {
            gameState = 'GAMEOVER';
        }

        // 弾との衝突判定
        bullets.forEach((bullet, bIndex) => {
            const distToBullet = Math.hypot(enemy.x - bullet.x, enemy.y - bullet.y);
            if (distToBullet < enemy.size + bullet.size) {
                // 衝突したら両方削除してスコア加算
                enemies.splice(eIndex, 1);
                bullets.splice(bIndex, 1);
                score += 10;
            }
        });
    });
}

// 画面描画
function draw() {
    // 画面クリア
    ctx.fillStyle = '#0f172a'; // 深い宇宙のような紺色
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'TITLE') {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('SPACESHIP SHOOTING', canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = '18px sans-serif';
        ctx.fillStyle = '#38bdf8';
        ctx.fillText('画面をタップしてスタート', canvas.width / 2, canvas.height / 2 + 30);
        return;
    }

    if (gameState === 'GAMEOVER') {
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = '18px sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
        ctx.fillStyle = '#38bdf8';
        ctx.fillText('タップしてリトライ', canvas.width / 2, canvas.height / 2 + 60);
        return;
    }

    // --- プレイ中の描画 ---
    
    // プレイヤーの描画（かっこいい三角形）
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.moveTo(player.x, player.y - player.size);
    ctx.lineTo(player.x - player.size, player.y + player.size);
    ctx.lineTo(player.x + player.size, player.y + player.size);
    ctx.closePath();
    ctx.fill();

    // 弾の描画
    ctx.fillStyle = '#facc15';
    bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
        ctx.fill();
    });

    // 敵の描画
    ctx.fillStyle = '#f87171';
    enemies.forEach(e => {
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
        ctx.fill();
    });

    // スコアの描画
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 20, 50);
}

// ループ開始
requestAnimationFrame(gameLoop);
</script>

</body>
</html>
